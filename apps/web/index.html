    <noscript>
      <h1>crt.watch — SSL/TLS certificate and service monitoring</h1>
      <p>
        crt.watch is a self-hosted monitoring service for TLS certificates and the
        services behind them. It watches certificate expiry windows, certificate chains
        and trust, hostname and SAN mismatches, TLS protocol versions and cipher suites,
        STARTTLS on SMTP, IMAP, POP3 and FTP, implicit TLS on SMTPS, IMAPS, POP3S, LDAPS
        and FTPS, HTTP and HTTPS endpoints, SSH banners, service logins, DNS resolution
        drift and SSL Labs assessments — then alerts through email, chat or webhooks
        before anything expires or breaks.
      </p>
      <p>
        It runs as a single Docker container with SQLite on disk, and offers public
        status pages, embeddable badges, a REST API and Prometheus metrics.
      </p>
      <p>
        This interface needs JavaScript. The source and setup instructions are at
        <a href="https://github.com/brightcolor/crt.watch">github.com/brightcolor/crt.watch</a>.
      </p>
